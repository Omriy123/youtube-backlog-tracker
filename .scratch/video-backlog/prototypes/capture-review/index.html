<!doctype html>
<!-- THROWAWAY: Three window-save rediscovery presentations, ?variant=A|B|C.
     All data, saving, closing and review are simulated in memory. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window save review — throwaway comparison</title>
<style>
:root{font:14px 'Segoe UI',Arial,sans-serif;color:#24352f;background:#eeefe6;--green:#256349;--line:#dce2d9;--muted:#65756d}*{box-sizing:border-box}body{margin:0;padding-bottom:110px}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid #ccd6c9;border-radius:6px;background:#fffef9;color:inherit;padding:7px 11px}button:hover{background:#edf2e7;border-color:#718975}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #bd8b27;outline-offset:2px}button.primary{background:var(--green);color:white;border-color:var(--green)}button.small{padding:4px 8px;font-size:12px}button.quiet{border-color:transparent;background:transparent}select{background:white;border:1px solid #ccd6c9;border-radius:6px;padding:7px;max-width:190px}input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:650}h2{font-size:20px}h3{font-size:16px}p{line-height:1.6}small,.muted{color:var(--muted);font-size:12px}.top{background:#fffef9;border-bottom:1px solid var(--line);padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:700;font-size:19px}.mark{display:inline-grid;place-items:center;width:29px;height:29px;background:var(--green);color:#edf3bd;border-radius:6px;margin-right:8px}.prototype{padding:8px 25px;background:#f1ead9;color:#6f634b;font-size:12px}.context{display:flex;max-width:1500px;margin:auto}.sidebar{width:215px;flex:none;padding:26px 18px}.sidebar div{padding:10px;border-radius:6px}.sidebar .active{background:#dce7d4}.sidebar hr{border:0;border-top:1px solid #cdd6c7;margin:15px 0}.sidebar small{display:block;margin:15px 10px 7px}.workspace{min-width:0;flex:1;padding:25px 25px 0 0}.panel{background:#fffef9;border:1px solid #cdd6c7;border-radius:10px;box-shadow:0 10px 30px #21382b0d;overflow:hidden}.intro{padding:22px 24px 15px}.intro p{margin-top:7px;color:var(--muted);font-size:13px}.toolbar{padding:13px 24px;background:#f5f6ef;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar label,.select-all{display:flex;align-items:center;gap:7px}.toolbar strong{font-size:12px}.spacer{flex:1}.hint{padding:12px 24px;font-size:12px;color:var(--muted);min-height:43px}.body-grid{display:grid;grid-template-columns:minmax(0,1fr)}.body-grid.split{grid-template-columns:minmax(0,1fr) 300px}.rows{padding:0 24px 10px}.row{border-bottom:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:23px 70px minmax(150px,1fr) 170px;gap:11px;align-items:center}.row.unselected{opacity:.65}.tile{width:70px;height:43px;border-radius:5px;background:var(--tile,#466f69);display:grid;place-items:center;color:#f2f4e5;font-size:18px}.name{font-weight:600;line-height:1.4;font-size:13px}.url{margin:4px 0;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px}.badge{padding:3px 7px;border-radius:4px;background:#f4e5d1;color:#825020;font-size:11px;line-height:1.5;border:1px solid transparent}.badge.clickable{border-color:#dec49b;text-decoration:underline;text-underline-offset:2px}.badge.green{background:#e2ecd9;color:#3d643d}.badge.neutral{background:#ecefe7;color:#65756d}.destination{display:flex;flex-direction:column;align-items:stretch;gap:4px}.destination small{font-size:10px}.expanded{grid-column:2 / -1;padding:13px 15px;background:#f5efdf;border-radius:6px;line-height:1.6;font-size:12px}.expanded dl,.detail dl{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:12px 0}.expanded dt,.detail dt{color:var(--muted)}dd{margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.review-pane{padding:19px;background:#f2f3ea;border-left:1px solid var(--line)}.review-pane h3{margin:10px 0}.queue{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.queue button.active{background:#dce7d4;border-color:#78936d}.detail p{font-size:13px;margin:10px 0}.detail dl{font-size:12px}.detail .actions{margin:18px 0}.footer{display:flex;gap:10px;align-items:center;padding:16px 24px;border-top:1px solid var(--line);background:#f5f6ef;flex-wrap:wrap}.footer .counts{flex:1;min-width:160px;line-height:1.6}.footer small{display:block}.results{margin-top:15px;border:1px solid var(--line);background:#fffef9;border-radius:8px;padding:18px 23px}.results p{font-size:13px;margin:6px 0}.result-row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;gap:12px;font-size:12px}.result-row span:last-child{color:var(--muted);text-align:right}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:center;padding:10px;background:#203b2f;color:white;border-radius:12px;box-shadow:0 6px 25px #17271e44;z-index:40;white-space:nowrap}.switcher button{background:#385447;color:white;border-color:#536c5e}.switcher button.active{background:#edf3bd;color:#203b2f}.switcher .label{min-width:185px}.switcher small{display:block;color:#c8d5c7;font-size:10px}.overlay{position:fixed;inset:0;background:#1b2a245c;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:#fffef9;border-radius:10px;padding:25px;width:490px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 50px #12201644}.dialog>header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.state{margin:15px 0 0;font-size:12px;color:var(--muted)}.state summary{cursor:pointer}.state pre{background:#e5e9dd;padding:12px;white-space:pre-wrap;font-size:11px}.comparison-note{margin:15px 0;font-size:12px;color:var(--muted);line-height:1.6}.sticky-review{position:sticky;top:15px}.queue-note{font-size:12px;color:#825020;margin:9px 0}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.sidebar{width:165px}.row{grid-template-columns:23px minmax(125px,1fr) 155px}.tile{display:none}.expanded{grid-column:2 / -1}.rows{padding-left:18px;padding-right:18px}.body-grid.split{grid-template-columns:minmax(0,1fr) 260px}.review-pane{padding:14px}.workspace{padding-right:15px}.switcher .label{min-width:140px}}
@media(max-width:780px){.sidebar{display:none}.workspace{padding:12px}.body-grid.split{grid-template-columns:1fr}.review-pane{border-left:0;border-top:1px solid var(--line)}.switcher{gap:5px;max-width:98vw;flex-wrap:wrap;justify-content:center}.switcher .label{display:none}.intro,.toolbar,.footer{padding-left:15px;padding-right:15px}.row{grid-template-columns:22px minmax(90px,1fr) 130px;gap:6px}.destination select{width:100%;font-size:12px}.top{padding:12px}.expanded dl,.detail dl{grid-template-columns:85px 1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark">▶</span>Video Library</div><button onclick="resetDemo()">Reset example</button></header>
<div class="prototype">Throwaway comparison · sample videos · no real tabs are saved, opened, or closed</div>
<div class="context"><aside class="sidebar"><div class="active">Inbox <small style="display:inline;margin:0">12</small></div><hr><small>WATCH LISTS · IMPORTANCE</small><div>Watch this weekend</div><div>Deep dives</div><div>Quick watches</div><hr><div>Backlog</div></aside>
<main class="workspace"><section class="panel"><div class="intro"><h1>Save tabs from this window</h1><p id="description"></p></div><div id="toolbar" class="toolbar"></div><div id="hint" class="hint"></div><div id="body"></div><div id="footer" class="footer"></div></section><div id="results"></div><p class="comparison-note" id="comparison"></p><details class="state"><summary>Prototype state — sample data and simulated outcomes</summary><pre id="state"></pre></details></main></div>
<nav class="switcher" aria-label="Prototype variants"><button aria-label="Previous variant" onclick="cycle(-1)">←</button><div class="label"><strong id="variant-label"></strong><small>Switching preserves your choices</small></div><button data-variant="A" onclick="setVariant('A')">A · Expand</button><button data-variant="B" onclick="setVariant('B')">B · Badge</button><button data-variant="C" onclick="setVariant('C')">C · Panel</button><button aria-label="Next variant" onclick="cycle(1)">→</button></nav>
<div id="modal"></div>
<script>
const variants={A:{name:'Expandable rows',description:'Previously watched or dismissed? Expand the row to review its history and choose Keep or Dismiss.',note:'A — Details stay beside each video. Expand the amber label. One row starts expanded to show the treatment.'},B:{name:'Clickable badges',description:'A compact list. Click an amber “Review” badge when you want to see previous activity.',note:'B — The list stays compact. Each Review badge opens a dialog with the same details and decisions.'},C:{name:'Separate review panel',description:'Keep the tab list compact and work through previous activity in a separate panel.',note:'C — Review several videos in one panel without expanding rows or opening a dialog. Click a badge or a queue button.'}};
const destinations=['Inbox','Watch this weekend','Deep dives','Quick watches','Backlog'];
const seed=[
 {id:1,title:'A quiet walk through Kyoto',url:'youtube.com/watch?v=sample-kyoto',kind:'new',destination:'Inbox',color:'#52786d'},
 {id:2,title:'How cities keep their water clean',url:'youtube.com/watch?v=sample-water',kind:'watched',destination:'Inbox',prior:'Deep dives',when:'12 September 2026, 19:42',events:2,color:'#5c7989'},
 {id:3,title:'Making a small walnut desk',url:'youtube.com/watch?v=sample-desk',kind:'new',destination:'Inbox',color:'#997559'},
 {id:4,title:'Every camera setting explained',url:'youtube.com/watch?v=sample-camera',kind:'dismissed',destination:'Inbox',prior:'Backlog',when:'3 October 2026, 10:18',events:0,color:'#756586'},
 {id:5,title:'Inside a mountain observatory',url:'youtube.com/watch?v=sample-stars',kind:'new',destination:'Watch this weekend',color:'#445778'},
 {id:6,title:'Why old maps look different',url:'youtube.com/watch?v=sample-maps',kind:'watched',destination:'Deep dives',prior:'Watch this weekend',when:'22 August 2026, 21:05',events:1,color:'#8a8255'},
 {id:7,title:'The secret life of fungi',url:'youtube.com/watch?v=sample-fungi',kind:'active',destination:'Backlog',color:'#59704b'},
 {id:8,title:'Email — not a recognized video page',url:'mail.example.test/inbox',kind:'fallback',destination:'Inbox',color:'#999d91',selected:false}
];
let rows,expanded,focused,modalId=null,results=[],notice='',variant=new URLSearchParams(location.search).get('variant');
if(!variants[variant])variant='A';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resetDemo(){rows=seed.map(r=>({...r,selected:r.selected!==false,decision:null,sourceOpen:true,outcome:null,pending:false}));expanded=new Set([2]);focused=2;modalId=null;results=[];notice='';render()}
function handled(r){return r.kind==='watched'||r.kind==='dismissed'}
function needs(r){return handled(r)&&r.destination==='Inbox'&&!r.decision&&!r.outcome&&r.selected}
function generic(r){return handled(r)&&r.destination==='Inbox'&&!r.outcome}
function queue(){return rows.filter(needs)}
function byId(id){return rows.find(r=>r.id===id)}
function selector(r){return `<select aria-label="Destination for ${esc(r.title)}" onchange="setDestination(${r.id},this.value)" ${r.kind==='active'||r.outcome?'disabled':''}>${destinations.map(d=>`<option ${r.destination===d?'selected':''}>${esc(d)}</option>`).join('')}</select>`}
function badge(r){
 if(r.outcome)return `<span class="badge ${r.pending?'':'green'}">${esc(r.pending?'Previous activity · review pending':r.outcome)}</span>`;
 if(r.kind==='active')return '<span class="badge neutral">Already saved · stays in Backlog</span>';
 if(r.kind==='fallback')return '<span class="badge neutral">Optional · URL/title fallback</span>';
 if(!handled(r))return '<span class="badge green">New to your Library</span>';
 if(r.destination!=='Inbox')return `<span class="badge">${r.kind==='watched'?'Watched':'Dismissed'} before · saves with review badge</span>`;
 const label=r.decision?`${r.decision==='keep'?'Keep → Inbox':'Dismiss'} · change`: `${r.kind==='watched'?'Watched':'Dismissed'} before · Review`;
 return `<button class="badge clickable" onclick="review(${r.id})" ${variant==='A'?`aria-expanded="${expanded.has(r.id)}"`:''}>${esc(label)}${variant==='A'?(expanded.has(r.id)?' ▴':' ▾'):''}</button>`;
}
function priorDetails(r){return `<dl><dt>Previous status</dt><dd>${r.kind==='watched'?'Watched':'Dismissed'}</dd><dt>Previous list</dt><dd>${esc(r.prior)}</dd><dt>${r.kind==='watched'?'Last marked watched':'Dismissed on'}</dt><dd>${esc(r.when)}</dd><dt>Watch events</dt><dd>${r.events}${r.events?' · opening was recorded; playback is unverified':''}</dd></dl>`}
function decisionButtons(r){return `<div class="actions"><button class="primary small" onclick="decide(${r.id},'keep')">Keep → Inbox</button><button class="small" onclick="decide(${r.id},'dismiss')">Dismiss</button>${r.decision?`<button class="quiet small" onclick="decide(${r.id},null)">Clear choice</button>`:''}</div>`}
function details(r){return `<div class="detail"><h3>${esc(r.title)}</h3>${priorDetails(r)}<p>Keep returns the existing record to Inbox. Dismiss retains it outside active lists. Earlier history stays intact.</p>${r.decision?`<p><strong>Chosen: ${r.decision==='keep'?'Keep → Inbox':'Dismiss'}</strong> · applied when you save.</p>`:''}${decisionButtons(r)}</div>`}
function render(){
 document.getElementById('description').textContent=variants[variant].description;
 document.getElementById('comparison').textContent=variants[variant].note;
 document.getElementById('variant-label').textContent=variant+' · '+variants[variant].name;
 document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});
 const selected=rows.filter(r=>r.selected&&!r.outcome),waiting=queue(),ready=selected.filter(r=>!needs(r));
 document.getElementById('toolbar').innerHTML=`<label class="select-all"><input type="checkbox" id="select-all" onchange="selectAll(this.checked)" ${selected.length===rows.filter(r=>!r.outcome).length&&selected.length?'checked':''}>Select all tabs</label><span class="spacer"></span><strong>Send selected to</strong><select aria-label="Shared destination" onchange="sendSelected(this.value);this.value='' "><option value="">Choose a list…</option>${destinations.map(d=>`<option>${esc(d)}</option>`).join('')}</select><button class="small" onclick="sendSelected('Inbox')">All selected → Inbox</button>`;
 const checkbox=document.getElementById('select-all');checkbox.indeterminate=selected.length>0&&selected.length<rows.filter(r=>!r.outcome).length;
 document.getElementById('hint').innerHTML=notice?esc(notice):`${selected.length} selected · ${waiting.length} need a Keep / Dismiss decision${waiting.length?` <button class="quiet small" onclick="decideBatch('keep')">Keep all ${waiting.length}</button><button class="quiet small" onclick="decideBatch('dismiss')">Dismiss all ${waiting.length}</button>`:''}`;
 document.getElementById('body').className='body-grid'+(variant==='C'?' split':'');
 document.getElementById('body').innerHTML=`<div class="rows">${rows.map(r=>`<div class="row ${r.selected?'':'unselected'}"><input type="checkbox" aria-label="Select ${esc(r.title)}" onchange="byId(${r.id}).selected=this.checked;notice='';render()" ${r.selected?'checked':''} ${r.outcome?'disabled':''}><div class="tile" style="--tile:${r.color}">▶</div><div><div class="name">${esc(r.title)}</div><div class="url">${esc(r.url)}</div><div class="badges">${badge(r)}</div></div><div class="destination">${selector(r)}${r.kind==='active'?'<small>Existing placement is preserved</small>':handled(r)&&r.destination!=='Inbox'?'<small>Explicit destination shortcut</small>':''}</div>${variant==='A'&&generic(r)&&expanded.has(r.id)?`<div class="expanded">${priorDetails(r)}${decisionButtons(r)}</div>`:''}</div>`).join('')}</div>${variant==='C'?renderPane():''}`;
 document.getElementById('footer').innerHTML=`<div class="counts"><strong>${ready.length} ready to save${waiting.length?' · '+waiting.length+' need a decision':''}</strong><small>Saving keeps source tabs open. Unanswered reviews remain available here.</small></div><button class="primary" onclick="saveReady()" ${ready.length?'':'disabled'}>Save ${ready.length} ready</button>`;
 renderResults();renderModal();renderState();
}
function renderPane(){let candidates=rows.filter(r=>generic(r)&&r.selected);if(!candidates.some(r=>r.id===focused))focused=candidates[0]?.id;const r=byId(focused);return `<aside class="review-pane"><div class="sticky-review"><small>PREVIOUS ACTIVITY</small><h3>${candidates.length} videos to review</h3><div class="queue">${candidates.map((r,i)=>`<button class="small ${r.id===focused?'active':''}" aria-label="Review ${esc(r.title)}" onclick="focused=${r.id};render()">${i+1}${r.decision?' ✓':''}</button>`).join('')}</div>${r&&candidates.length?details(r):'<p class="empty">No Inbox rediscoveries to review.</p>'}</div></aside>`}
function review(id){if(variant==='A'){expanded.has(id)?expanded.delete(id):expanded.add(id)}else if(variant==='B'){modalId=id}else focused=id;render()}
function renderModal(){const r=byId(modalId);document.getElementById('modal').innerHTML=r?`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="review-heading"><header><h2 id="review-heading">Review previous activity</h2><button onclick="closeModal()" aria-label="Close review">✕</button></header>${details(r)}<small>Your choice is applied when you save. Closing without a choice leaves this item unresolved.</small></section></div>`:''}
function closeModal(){modalId=null;render()}
function decide(id,value){byId(id).decision=value;notice='';if(variant==='B')modalId=null;if(variant==='C'&&value){const next=queue().find(r=>r.id!==id);if(next)focused=next.id}render()}
function decideBatch(value){queue().forEach(r=>r.decision=value);notice='';render()}
function setDestination(id,value){const r=byId(id);r.destination=value;r.decision=null;notice='';modalId=null;render()}
function sendSelected(value){rows.filter(r=>r.selected&&!r.outcome&&r.kind!=='active').forEach(r=>{r.destination=value;r.decision=null});notice=`Selected videos now target ${value}. Active exact duplicates keep their existing placement. Previous Keep / Dismiss choices were cleared where the destination changed.`;render()}
function selectAll(value){rows.filter(r=>!r.outcome).forEach(r=>r.selected=value);notice='';render()}
function saveReady(){let count=0;rows.filter(r=>r.selected&&!r.outcome&&!needs(r)).forEach(r=>{if(r.kind==='active'){r.outcome='Already saved · verified'}else if(generic(r)&&r.decision==='dismiss'){r.outcome='Dismissed · history retained'}else{r.pending=handled(r)&&r.destination!=='Inbox';r.outcome='Saved → '+r.destination}results.push(r.id);count++});notice=`Simulation: ${count} processed. ${queue().length} still need your decision. No browser tabs were changed.`;render()}
function renderResults(){const processed=rows.filter(r=>r.outcome),closable=processed.filter(r=>r.sourceOpen&&!r.pending&&r.decision!=='dismiss');document.getElementById('results').innerHTML=processed.length?`<section class="results"><h3>Save results <small>· simulated</small></h3><p>Ready items are processed; unanswered rows stay in the preview.</p>${processed.map(r=>`<div class="result-row"><span>${esc(r.title)}<br><small>${esc(r.outcome)}${r.pending?' · previous-activity review pending':''}</small></span><span>${r.sourceOpen?'Source tab still open':'Source tab closed (simulated)'}</span></div>`).join('')}<div class="actions"><button onclick="closeSaved()" ${closable.length?'':'disabled'}>Close ${closable.length} saved source tabs</button></div><p class="muted">Failed, unresolved, and pending-review items stay open. This button only changes the mock state.</p></section>`:''}
function closeSaved(){rows.filter(r=>r.outcome&&r.sourceOpen&&!r.pending&&r.decision!=='dismiss').forEach(r=>r.sourceOpen=false);notice='Source-tab closing simulated. No actual browser tabs were closed.';render()}
function renderState(){document.getElementById('state').textContent=JSON.stringify({variant,unresolved:queue().map(r=>r.title),rows:rows.map(({id,title,selected,destination,decision,outcome,pending,sourceOpen})=>({id,title,selected,destination,decision,outcome,pending,sourceOpen}))},null,2)}
function setVariant(value){variant=value;modalId=null;notice='';const u=new URL(location.href);u.searchParams.set('variant',value);history.replaceState(null,'',u);render()}
function cycle(step){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+step+3)%3])}
window.addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';render()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalId){closeModal();return}if(modalId||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
resetDemo();
</script>
</body>
</html>
