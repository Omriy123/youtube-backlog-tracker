<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library · Video Backlog</title><link rel="stylesheet" href="styles.css"></head>
<body class="library"><aside><div class="brand">Video Backlog</div><nav aria-label="Library views"><button aria-current="page" data-view="Inbox">Inbox</button><button data-view="Entire Library">Entire Library</button></nav></aside><main><header><p class="eyebrow">YOUR LIBRARY</p><h1>Inbox</h1><p id="count"></p><label class="date-preference">Date and time display<select id="date-format"><option value="browser">Browser default</option><option value="israeli">Israeli (DD/MM/YYYY, 24h)</option></select></label></header><label class="search">Search Library<input type="search" placeholder="Search titles or URL" aria-label="Search Library"></label><fieldset class="search-scopes"><legend>Search title versions</legend><label><input type="checkbox" name="personal" checked>Personal</label><label><input type="checkbox" name="original" checked>Original</label><label><input type="checkbox" name="intermediate" checked>Intermediate</label><label><input type="checkbox" name="latest" checked>Latest</label></fieldset><p class="muted">Personal searches your current edited title. Original is the first usable captured title; Intermediate covers captures between Original and Latest; Latest is the most recent capture. URL is always searched.</p><p id="scope-status" class="muted">URL always included.</p><p role="status" aria-live="polite"></p><section id="opening-recovery" aria-label="Opening recovery"></section><section id="records" aria-label="Saved videos"></section></main><script type="module" src="library.js"></script></body></html>
